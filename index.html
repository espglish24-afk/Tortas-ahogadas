
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos - Tortas Ahogadas El Pícoro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #c0392b;
      --primary-dark: #8e1c10;
      --accent: #d35400;
      --yellow: #f1c40f;
      --cream: #fff9f0;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --border-radius: 16px;
      --whatsapp-green: #25D366;
      --whatsapp-dark: #128C7E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--cream);
      color: var(--text);
      line-height: 1.5;
      padding: 10px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
      border: 2px solid #f3e5d8;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-family: 'Fredoka', cursive;
      font-size: 2rem;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    header p {
      font-weight: 600;
      font-size: 1rem;
      background: var(--yellow);
      color: var(--primary-dark);
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
    }

    .business-info {
      margin-top: 12px;
      font-size: .9rem;
      font-weight: 600;
      line-height: 1.7;
    }

    form {
      padding: 20px 15px;
    }

    .step-card {
      background: #fff;
      border: 2px solid #f0e4d7;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .step-title {
      font-family: 'Fredoka', cursive;
      font-size: 1.15rem;
      color: var(--primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px dashed #f0e4d7;
      padding-bottom: 6px;
    }

    .step-number {
      background: var(--primary);
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .85rem;
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: .88rem;
      margin-bottom: 5px;
      color: #4a5568;
    }

    input[type="text"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: .95rem;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
    }

    .btn-geo {
      width: 100%;
      background: #34495e;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-geo:disabled {
      opacity: .7;
      cursor: wait;
    }

    .geo-status {
      font-size: .82rem;
      margin-top: 6px;
      font-weight: 600;
      display: none;
      overflow-wrap: anywhere;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
    }

    .option-btn {
      position: relative;
    }

    .option-btn input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
    }

    .option-label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 10px 8px;
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: .88rem;
      text-align: center;
    }

    .option-btn input:checked + .option-label {
      background: #fdf2e9;
      border-color: var(--accent);
      color: var(--accent);
    }

    .option-btn input:focus-visible + .option-label {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-submit {
      width: 100%;
      background: var(--whatsapp-green);
      color: white;
      border: none;
      padding: 16px;
      font-size: 1.15rem;
      font-family: 'Fredoka', cursive;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-transform: uppercase;
    }

    .btn-submit:hover {
      background: var(--whatsapp-dark);
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>Tortas Ahogadas El Pícoro</h1>
      <p>Formulario de Pedidos a Domicilio</p>

      <div class="business-info">
        <div>1 de Mayo núm. 85, Santa Cruz del Valle</div>
        <div>Teléfonos: 608 5413 · 33-1832-5771</div>
        <div>Servicio a domicilio</div>
      </div>
    </header>

    <form id="orderForm">

      <!-- 1. DATOS DEL CLIENTE -->
      <div class="step-card">
        <div class="step-title">
          <span class="step-number">1</span>
          <span>Datos del Cliente</span>
        </div>

        <div class="form-group">
          <label for="nombre">Nombre y Apellido *</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ej. Juan Pérez"
            required
          >
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono (Celular) *</label>
          <input
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="Ej. 33 1234 5678"
            required
          >
        </div>

        <div class="form-group">
          <label for="direccion">
            Dirección Completa, Colonia y Referencias *
          </label>

          <input
            type="text"
            id="direccion"
            name="direccion"
            placeholder="Calle, número, colonia y entre qué calles"
            required
          >

          <button type="button" class="btn-geo" id="btnLocation">
            <span>📍</span> Adjuntar mi ubicación GPS
          </button>

          <p id="geoStatus" class="geo-status" role="status"></p>
        </div>
      </div>

      <!-- 2. PAQUETES -->
      <div class="step-card">
        <div class="step-title">
          <span class="step-number">2</span>
          <span>Elige tu paquete</span>
        </div>

        <div class="form-group">
          <label>Selecciona el paquete que deseas *</label>

          <div class="options-grid">

            <label class="option-btn">
              <input
                type="radio"
                name="paquete"
                value="Paquete mini: 1 torta"
                required
              >
              <span class="option-label">
                Paquete mini<br>1 torta
              </span>
            </label>

            <label class="option-btn">
              <input
                type="radio"
                name="paquete"
                value="Paquete 1: 1 torta y 2 tacos"
              >
              <span class="option-label">
                Paquete 1<br>1 torta y 2 tacos
              </span>
            </label>

            <label class="option-btn">
              <input
                type="radio"
                name="paquete"
                value="Paquete 2: 4 tortas y 5 tacos"
              >
              <span class="option-label">
                Paquete 2<br>4 tortas y 5 tacos
              </span>
            </label>

            <label class="option-btn">
              <input
                type="radio"
                name="paquete"
                value="Paquete 3: 5 tortas y 10 tacos"
              >
              <span class="option-label">
                Paquete 3<br>5 tortas y 10 tacos
              </span>
            </label>

          </div>
        </div>

        <div class="form-group">
          <label for="cantidadPaquetes">Cantidad de paquetes</label>

          <select id="cantidadPaquetes" name="cantidadPaquetes">
            <option value="0">0</option>
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5 o más">5 o más</option>
          </select>
        </div>
      </div>

      <!-- 3. ENTREGA Y PAGO -->
      <div class="step-card">
        <div class="step-title">
          <span class="step-number">3</span>
          <span>Entrega y Pago</span>
        </div>

        <div class="form-group">
          <label>Hora de Pedido</label>

          <div class="options-grid">
            <label class="option-btn">
              <input
                type="radio"
                name="hora"
                value="Lo antes posible"
                checked
              >
              <span class="option-label">Lo antes posible</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>Método de Pago</label>

          <div class="options-grid">
            <label class="option-btn">
              <input
                type="radio"
                name="pago"
                value="Efectivo"
                checked
              >
              <span class="option-label">Efectivo</span>
            </label>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <span>Enviar Pedido por WhatsApp</span>
      </button>

    </form>
  </div>

  <script>
    let mapUrl = "";

    const btnLocation = document.getElementById("btnLocation");
    const geoStatus = document.getElementById("geoStatus");

    // GPS: conserva la función de geolocalización original.
    btnLocation.addEventListener("click", () => {
      geoStatus.style.display = "block";

      if (!navigator.geolocation) {
        geoStatus.style.color = "#c0392b";
        geoStatus.textContent =
          "Tu dispositivo o navegador no permite la geolocalización.";
        return;
      }

      btnLocation.disabled = true;
      geoStatus.style.color = "#27ae60";
      geoStatus.textContent =
        'Obteniendo GPS... Presiona "Permitir" si el navegador lo solicita.';

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          mapUrl = `https://maps.google.com/?q=${lat},${lng}`;

          geoStatus.style.color = "#27ae60";
          geoStatus.textContent =
            "¡Ubicación GPS agregada con éxito!";

          btnLocation.disabled = false;
          btnLocation.innerHTML =
            "<span>📍</span> Actualizar mi ubicación GPS";
        },

        (error) => {
          mapUrl = "";
          geoStatus.style.color = "#c0392b";

          if (error.code === error.PERMISSION_DENIED) {
            geoStatus.textContent =
              "Permiso de ubicación denegado. Activa el permiso de ubicación para este sitio en el navegador.";
          } else if (error.code === error.TIMEOUT) {
            geoStatus.textContent =
              "La ubicación tardó demasiado. Activa el GPS e inténtalo de nuevo.";
          } else {
            geoStatus.textContent =
              "No se pudo obtener la ubicación. Revisa el GPS y los permisos del navegador.";
          }

          btnLocation.disabled = false;
          btnLocation.innerHTML =
            "<span>📍</span> Intentar obtener ubicación GPS";
        },

        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    });

    // ENVÍO DEL PEDIDO POR WHATSAPP
    document.getElementById("orderForm").addEventListener(
      "submit",
      function(e) {
        e.preventDefault();

        // Número de WhatsApp que ya tenía el código original.
        const phone = "523319053634";

        const nombre =
          document.getElementById("nombre").value.trim();

        const telefono =
          document.getElementById("telefono").value.trim();

        const direccion =
          document.getElementById("direccion").value.trim();

        const paqueteSeleccionado =
          document.querySelector('input[name="paquete"]:checked');

        if (!paqueteSeleccionado) {
          alert("Por favor, selecciona un paquete.");
          return;
        }

        const paquete = paqueteSeleccionado.value;

        const cantidadPaquetes =
          document.getElementById("cantidadPaquetes").value;

        const hora =
          document.querySelector('input[name="hora"]:checked').value;

        const pago =
          document.querySelector('input[name="pago"]:checked').value;

        let text = "*NUEVO PEDIDO - TORTAS AHOGADAS EL PÍCORO*\n\n";

        text += `*Cliente:* ${nombre}\n`;
        text += `*Teléfono:* ${telefono}\n`;
        text += `*Dirección:* ${direccion}\n`;

        if (mapUrl) {
          text += `*Ubicación GPS:* ${mapUrl}\n`;
        }

        text += "\n--- DETALLE DEL PEDIDO ---\n";
        text += `*Paquete:* ${paquete}\n`;
        text += `*Cantidad de paquetes:* ${cantidadPaquetes}\n`;

        text += "\n--- ENTREGA Y PAGO ---\n";
        text += `*Hora:* ${hora}\n`;
        text += `*Pago:* ${pago}\n`;

        const whatsappUrl =
          `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;

        // Abrir WhatsApp desde el navegador.
        window.location.href = whatsappUrl;
      }
    );
  </script>
</body>
  </html>
